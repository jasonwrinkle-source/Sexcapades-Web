<meta name="twitter:description" content="Pick a map. Each one opens a different hard conversation." />
<script>
  // Hostname router (2026-11-16): one shared folder serves every
  // capades.io host, and the root page sends each visitor to the right
  // front door. Query params (e.g. ?utm_source=...) and #fragment are
  // forwarded on every route, as the old blanket redirect did.
  //   sex hosts (sexcapades.io, sex.capades.io) -> age gate (or app if verified)
  //   flex.capades.io                          -> the skin picker
  //   capades.io                               -> the engine page
  //   <prefix>.capades.io (vanilla skins)      -> app directly (bypassing gate)
  //   anything else (localhost, unknown hosts) -> app directly
  // No meta-refresh: it would drop the fragment before JS runs.
  (function () {
    var host = "";
    try { host = window.location.hostname.toLowerCase(); } catch (e) { host = ""; }
    var qs = window.location.search || "";
    var frag = window.location.hash || "";
    function go(path) { window.location.replace(path + qs + frag); }
    function hasGatePass() {
      try {
        if (document.cookie.indexOf('sexcapades_age_verified=1') !== -1) return true;
        return window.localStorage.getItem('sexcapades_age_verified') === 'true';
      } catch (e) { return false; }
    }
    var SEX_HOSTS = { "sexcapades.io": 1, "www.sexcapades.io": 1, "sex.capades.io": 1, "www.sex.capades.io": 1 };
    if (SEX_HOSTS[host]) {
      if (hasGatePass()) { go("/hosted/app.html"); return; }
      go("/hosted/gate.html");
      return;
    }
    if (host === "flex.capades.io") { go("/picker.html"); return; }
    if (host === "capades.io") { go("/engine.html"); return; }
    var SKINS = { sex: 1, polis: 1, fores: 1, philo: 1, aesth: 1, voca: 1, tech: 1, dharma: 1, theori: 1, praxi: 1, quanta: 1, experi: 1, simul: 1, matter: 1, chem: 1, nous: 1, dance: 1, quest: 1 };
    var prefix = /\.capades\.io$/.test(host) ? host.split(".")[0] : "";
    if (prefix && SKINS[prefix]) {
      if (prefix === "sex") {
        if (hasGatePass()) { go("/hosted/app.html"); return; }
        go("/hosted/gate.html");
        return;
      }
      go("/hosted/app.html");
      return;
    }
    // Default to flex.capades.io (picker) when no valid host/skin specified
    go("/picker.html");
  })();
</script>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0b1014" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</head>
<body>

</body>
